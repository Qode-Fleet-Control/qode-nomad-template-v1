# fleet.conf - app manifest. Sourced (as shell) by the lifecycle scripts
# (bin/run bin/start bin/restart bin/reload bin/stop). $PORT is available
# inside every command. An empty command skips that step.

NAME="Nomad Template"
PORT=""
HEALTH_PATH=""

# Without docker: needs the nomad CLI (>= 1.5, for HCL2 variables) on PATH. This project
# serves no HTTP, so START_CMD is empty; the job itself is `sh scripts/check.sh` (it starts
# and stops its own dev agent on 127.0.0.1:${NOMAD_DEV_PORT:-4646}).
INSTALL_CMD=''
BUILD_CMD='nomad fmt -check -recursive jobs'
START_CMD=''
RELOAD_CMD=''

# --- docker runtime (compose.yaml) ---------------------------------------------
# How the fleet runs the app: as containers, in the coordinator's private docker. These
# REPLACE the commands above, which stay for the QA tester's self-host and for local work
# without docker (`FLEET_RUNTIME=process bin/run`). START runs compose in the FOREGROUND
# so the fleet's stop can end it. See bin/_common.sh.
DOCKER_BUILD_CMD='docker compose build'
DOCKER_START_CMD=''                 # serves no HTTP; `docker compose run --rm app` runs the job
DOCKER_RELOAD_CMD=''
